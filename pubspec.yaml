name: agent_loop
description: >-
  Each trajectory's own agent loop: it writes conversation turns straight
  to the logbook (RULINGS), starting with the Teams module's arrivals.
repository: https://github.com/intersyntactic/agent_loop
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_content_id: ^0.2.0
  is_conversation_shapes: ^0.8.2
  is_journal: ^0.9.0
  is_journal_client: ^0.1.2
  is_docking_station:
    git:
      url: https://github.com/intersyntactic/docking_station.git
      ref: 8f299f352734ba40599e3933eb3418d8c3256ddb
  is_logbook: ^0.2.0
  is_logbook_client: ^0.2.0
  is_shapes: ^0.5.0
  is_airlock_api: ^0.9.0
  is_effects: ^0.7.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
