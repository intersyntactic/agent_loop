name: agent_loop
description: >-
  Each trajectory's own agent loop: it writes conversation turns straight
  to the logbook (RULINGS), and replies through the airlock with the
  requests a program it is given draws its reply as, knowing no external
  system.
version: 0.14.0
repository: https://github.com/intersyntactic/agent_loop
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.4.0
  is_content_id: ^0.2.0
  is_conversation_vocabulary: ^0.2.0
  is_docking_station_api: ^0.11.0
  is_logbook_client: ^0.4.0
  is_shapes: ^0.6.0
  is_airlock_api: ^0.26.0
  is_flight_rules: ^0.12.0
  is_model_vocabulary: ^0.5.0
  is_outcome_vocabulary: ^0.1.0
  is_program_request_vocabulary: ^0.1.0
  is_sign_in_vocabulary: ^0.1.2
  is_tool_definition_vocabulary: ^0.8.0
  is_web_address_vocabulary: ^0.1.2
  is_web_request_vocabulary: ^0.1.0

dev_dependencies:
  # Tests start a real LogbookService; nothing outside test/ may import it.
  is_logbook: ^0.5.0
  is_file_request_vocabulary: ^0.1.0
  is_relative_path_vocabulary: ^0.1.0
  lints: ^6.1.0
  test: ^1.33.0
