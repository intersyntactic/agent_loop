name: agent_loop
description: >-
  Each trajectory's own agent loop: it writes conversation turns straight
  to the logbook (RULINGS), and answers through the airlock by reference,
  knowing no external system.
repository: https://github.com/intersyntactic/agent_loop
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_content_id: ^0.2.0
  is_conversation_shapes: ^0.8.3
  is_docking_station: ^0.2.0
  is_logbook: ^0.2.1
  is_logbook_client: ^0.2.0
  is_shapes: ^0.6.0
  is_airlock_api:
    git:
      url: https://github.com/intersyntactic/airlock_api.git
      ref: 757db10ecad0c700239134de64dde31486e88cde
  is_effects: ^0.12.0
  is_flight_rules: ^0.3.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
