  to the journal (RULINGS), starting with the Teams module's arrivals.
repository: https://github.com/intersyntactic/agent_loop
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_content_id: ^0.2.0
  is_conversation_shapes: ^0.8.2
  is_journal: ^0.9.0
  is_journal_client: ^0.1.2
  is_docking_station:
    git:
      url: https://github.com/intersyntactic/docking_station.git
      ref: 6b08790c02fd005f418196873c9206df68d3fb43
  is_logbook: ^0.1.0
  is_logbook_client: ^0.1.0
  is_shapes: ^0.5.0
  is_airlock_api: ^0.8.0

dev_dependencies:
  is_effects: ^0.7.0
  lints: ^6.1.0
  test: ^1.33.0
