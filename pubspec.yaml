name: agent_loop
description: >-
  Each trajectory's own agent loop: it writes conversation turns straight
  to the logbook (RULINGS), starting with the Teams module's arrivals.
repository: https://github.com/intersyntactic/agent_loop
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_content_id: ^0.2.0
  is_conversation_shapes: ^0.8.3
  is_docking_station: ^0.2.0
  is_logbook: ^0.2.1
  is_logbook_client: ^0.2.0
  is_shapes: ^0.6.0
  is_airlock_api: ^0.12.1
  is_effects: ^0.11.0
  is_teams_module:
    git:
      url: https://github.com/intersyntactic/teams_module.git
      ref: 9a3bf6877343e558c6b03871bcb0431f2604cdd5

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
