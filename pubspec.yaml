name: agent_loop
description: >-
  Each journey path's own agent loop: it writes conversation turns straight
  to the journal (RULINGS), starting with the Teams module's arrivals.
repository: https://github.com/intersyntactic/agent_loop
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  is_journal: ^0.8.0
  is_journal_client: ^0.1.0
  is_shapes: ^0.4.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

dependency_overrides:
  # is_journal_client 0.1.0 pins is_journal ^0.7.0, which can't resolve
  # alongside our own ^0.8.0. journal-client-7e tested this exact override
  # against is_journal_client/pull/2 (0.1.1, is_journal '>=0.7.0 <0.9.0'),
  # which waits on Nick's merge and go to publish. Drop this the moment
  # 0.1.1 is on pub.dev — do not merge this PR with it still in place.
  is_journal: ^0.8.0
